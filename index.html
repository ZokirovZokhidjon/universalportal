<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Portal - Асосий Саҳифа</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* GOOGLE TRANSLATE НИ БУТУНЛАЙ ЯШИРИШ СТИЛЛАРИ */
        #google_translate_element, 
        .goog-te-banner-frame, 
        .skiptranslate,
        .goog-te-spinner-pos {
            display: none !important;
        }
        body {
            top: 0px !important;
            position: static !important;
        }
        .goog-te-gadget {
            height: 0 !important;
            overflow: hidden !important;
        }

        /* Оригинал ранглар */
        :root { 
            --blue: #c5c5be; 
            --dark: #26323d; 
            --bg: #19749e; 
            --orange: #30698a; 
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-Aqm5aA_IYIYZ1w08k071qDbCx72bVwEffQ&s); background-size: cover; margin: 0; }
        
        /* 3 ТА ТИЛ ТУГМАСИ СТИЛЛАРИ */
        .lang-buttons {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 6px;
            z-index: 100;
        }
        .lang-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ffffff;
            color: var(--dark);
            padding: 6px 14px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .lang-btn:hover {
            background: #34495e;
            color: #ffffff;
        }
        /* Актив тил тугмаси */
        .lang-btn.active-lang {
            background: #d63f10;
            color: #ffffff;
            border-color: #d63f10;
        }

        .test-banner { background-image: var(--orange); color: rgb(243, 241, 241); text-align: center; padding: 10px; font-weight: bold; }
        
        header { background: #42b2c9; padding: 20px; border-bottom: 2px solid var(--blue); text-align: center; position: relative; }
        header h1 { margin: 0 0 15px 0; color: var(--dark); font-size: 28px; }
        header img { border-radius: 50%; border: 3px groove red; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 100px; height: 100px; }
        
        .admin-icon { position: absolute; top: 20px; right: 20px; font-size: 30px; color: var(--blue); text-decoration: none; transition: 0.3s; }
        .admin-icon:hover { color: var(--dark); }
        
        .search-container { max-width: 500px; margin: 15px auto; display: flex; gap: 5px; padding: 0 15px; }
        .search-container input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .search-container button { padding: 10px 20px; background: var(--blue); color: white; border: none; border-radius: 8px; cursor: pointer; }

        /* Реклама блоки услублари */
        #adBlock { max-width: 1200px; margin: 15px auto; display: none; text-align: center; padding: 0 15px; }
        #adBlock img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* МЕНЮ БАР */
        .menu-bar { background: white; padding: 10px; text-align: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 5px; }
        
        .menu-btn { background: #d63f10; border: 1px solid var(--blue); color: white; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 500; transition: 0.2s; display: inline-block; vertical-align: middle; }
        .menu-btn.active { background: var(--blue); color: white; }
        
        .dropdown { position: relative; display: inline-block; }
        .main-drop-btn { background-color: #34495e; color: white; }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 200px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.2);
            z-index: 9999;
            border-radius: 8px;
            margin-top: 8px;
            right: 0;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .dropdown-content .menu-btn {
            color: #26323d !important;
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
            background: none !important;
            border: none !important;
            margin: 0;
            border-radius: 0;
            cursor: pointer;
            box-sizing: border-box;
            border-bottom: 1px solid #eee;
            font-weight: normal;
        }

        .dropdown-content .menu-btn:last-child { border-bottom: none; }
        .dropdown-content .menu-btn:hover { background-color: #f1f1f1 !important; color: #d63f10 !important; }
        .dropdown-content .menu-btn.active { background-color: #19749e !important; color: white !important; }

        .tv-link { display: block !important; color: wheat !important; background-color: #2c3e50 !important; text-align: center !important; text-decoration: none; }
        .tv-link:hover { background-color: #34495e !important; }

        .show { display: block !important; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        
        .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid #eee; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-tag { font-size: 11px; background: var(--blue); color: #fff; padding: 3px 8px; border-radius: 5px; align-self: flex-start; margin-bottom: 10px; }
        .card-title { font-size: 18px; margin: 0 0 15px 0; color: var(--dark); font-weight: bold; line-height: 1.4; }
        .card-stats { font-size: 12px; color: #555; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .read-more { margin-top: auto; color: #548bca; text-decoration: none; font-weight: bold; font-size: 14px; border-top: 1px solid #f5f5f5; padding-top: 10px; display: block; }
    </style>
</head>
<body>

<!-- ЯШИРИН GOOGLE TRANSLATE КОМПОНЕНТИ -->
<div id="google_translate_element"></div>

<div class="test-banner"> 
  <marquee behavior="scroll" direction="left" scrollamount="10">📢 Ушбу сайт тест режимида ишламоқда</marquee>
</div>
<header>
    <!-- 3 ТА ТИЛ ТУГМАСИ -->
    <div class="lang-buttons notranslate">
        <button class="lang-btn" id="lang-uz" onclick="setLanguage('uz')">Ўзбекча</button>
        <button class="lang-btn" id="lang-ru" onclick="setLanguage('ru')">Русский</button>
        <button class="lang-btn" id="lang-en" onclick="setLanguage('en')">English</button>
    </div>

    <a class='admin-icon notranslate' href='admin.html' title='Шахсий кабинет'><i class="fas fa-user-circle"></i></a>
    <h1 class="notranslate">UNIVERSAL PORTAL</h1>
    <img src="logo1.jpg" alt="logo" onerror="this.style.display='none'">
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Сайтдан қидириш...">
        <button onclick="searchPosts()">Қидириш</button>
    </div>
</header>

<div id="adBlock">
    <a id="adLink" href="#" target="_blank">
        <img id="adImg" src="" alt="Реклама">
    </a>
</div>

<nav class="menu-bar">
    <button class="menu-btn active" onclick="filterCat('all', this)">Ҳаммаси</button>
    <button class="menu-btn" onclick="filterCat('Янгиликлар', this)">Янгиликлар</button>
    <button class="menu-btn" onclick="filterCat('Кинотеатр', this)">Кинотеатр</button>
    <button class="menu-btn" onclick="filterCat('Клиплар', this)">Клиплар</button>
    
    <div class="dropdown">
        <button class="menu-btn main-drop-btn" id="mainDropBtn" onclick="toggleDropdown(event)">
            <span id="dropBtnText">Бошқалар</span> <span class="arrow">▼</span>
        </button>
        
        <div id="dropdownContent" class="dropdown-content">
            <button class="menu-btn" onclick="filterCat('Tabobat', this)">Табобат</button>
            <button class="menu-btn" onclick="filterCat('Ҳикоялар', this)">Ҳикоялар</button>
            <button class="menu-btn" onclick="filterCat('Хангомалар', this)">Хангомалар</button>
            <button class="menu-btn" onclick="filterCat('Кулинария', this)">Кулинария</button>
            <button class="menu-btn" onclick="filterCat('Шеърият', this)">Шеърият</button>   
            <a href="tv.html" class="menu-btn tv-link notranslate">Тв каналлар</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="news-grid" id="newsWrapper">Юкланмоқда...</div>
</div>

<!-- GOOGLE TRANSLATE ENGINE СКРИПТИ -->
<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'uz',
            includedLanguages: 'uz,ru,en',
            autoDisplay: false
        }, 'google_translate_element');

        const savedLang = localStorage.getItem("app_lang") || "uz";
        updateLangButtons(savedLang);
    }

    function setLanguage(lang) {
        localStorage.setItem("app_lang", lang);

        // Гугл таржимони Cookie'сини тозалаш ва янгисини ёзиш
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + window.location.hostname + "; path=/;";

        if (lang !== 'uz') {
            document.cookie = "googtrans=/uz/" + lang + "; path=/;";
            document.cookie = "googtrans=/uz/" + lang + "; domain=" + window.location.hostname + "; path=/;";
        }

        // Тилни танлаганда саҳифа автоматик қайта юкланади ва Гугл таржима қилади
        location.reload();
    }

    function updateLangButtons(lang) {
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active-lang'));
        const activeBtn = document.getElementById(`lang-${lang}`);
        if (activeBtn) activeBtn.classList.add('active-lang');
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCO079n6tlKKTXi1LjtSB1t0ddsxDMQUW4",
        authDomain: "universal-portal-108b7.firebaseapp.com",
        databaseURL: "https://universal-portal-108b7-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "universal-portal-108b7",
        storageBucket: "universal-portal-108b7.appspot.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allPosts = {};
    let currentCategory = 'all';
    let currentSearchTerm = '';

    // ТАШРИФЛАРНИ ҲИСОБЛАШ ФУНКЦИЯСИ
    async function trackVisitor() {
        if (sessionStorage.getItem("visited")) return;
        sessionStorage.setItem("visited", "true");

        const today = new Date().toISOString().split('T')[0];
        const updates = {};
        
        updates[`analytics/daily_views/${today}`] = increment(1);

        try {
            const response = await fetch('https://ipapi.co/json/');
            const geoData = await response.json();
            const country = geoData.country_name || "Номаълум";

            updates[`analytics/countries/${country}`] = increment(1);
        } catch (error) {
            updates[`analytics/countries/Номаълум`] = increment(1);
        }

        update(ref(db), updates);
    }

    trackVisitor();

    // МЕНЮНИ ОЧИШ ВА ЁПИШ ФУНКЦИЯЛАРИ
    window.toggleDropdown = function(event) {
        event.stopPropagation();
        document.getElementById("dropdownContent").classList.toggle("show");
    }

window.addEventListener('click', function(event) {
    const dropdown = document.getElementById("dropdownContent");
    // Фақат меню очиқ бўлсагина ёпиш логикасини ишлатамиз
    if (dropdown && dropdown.classList.contains('show')) {
        if (!event.target.closest('.dropdown')) {
            dropdown.classList.remove('show');
        }
    }
});

    // Рекламани Firebase дан юклаш
    onValue(ref(db, 'ads'), (s) => {
        const ad = s.val();
        if(ad && ad.img) {
            document.getElementById('adBlock').style.display = 'block';
            document.getElementById('adImg').src = ad.img;
            document.getElementById('adLink').href = ad.link || "#";
        }
    });

    // Мақолаларни олиш
    onValue(ref(db, 'all_posts'), (snapshot) => {
        allPosts = snapshot.val() || {};
        renderPosts('all');
    });

    // Категория танлаш функцияси
    window.filterCat = (category, btn) => {
        document.querySelectorAll('.menu-bar .menu-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const mainBtn = document.getElementById('mainDropBtn');
        const hiddenCats = ['Tabobat', 'Ҳикоялар', 'Хангомалар', 'Кулинария', 'Шеърият'];
        
        if(hiddenCats.includes(category)) {
            mainBtn.classList.add('active');
        } else {
            mainBtn.classList.remove('active');
        }
        
        currentCategory = category;
        renderPosts(category, currentSearchTerm);
        document.getElementById("dropdownContent").classList.remove("show");
    };

    // Қидириш тизими
    window.searchPosts = () => {
        currentSearchTerm = document.getElementById('searchInput').value.toLowerCase();
        renderPosts(currentCategory, currentSearchTerm);
    };

    function renderPosts(category, searchTerm = "") {
        const wrapper = document.getElementById('newsWrapper');
        wrapper.innerHTML = "";
        
        const keys = Object.keys(allPosts).reverse();
        let found = 0;

        keys.forEach(id => {
            const p = allPosts[id];
            
            const matchCat = (category === 'all' || p.category === category);
            const matchSearch = p.title.toLowerCase().includes(searchTerm);

            if (matchCat && matchSearch) {
                found++;
                const card = document.createElement('div');
                card.className = 'card';
                
                let mediaHtml = "";
                if (p.image) {
                    mediaHtml = `<img src="${p.image}" class="card-img" alt="${p.title}" onerror="this.style.display='none'">`;
                } else if (p.video) {
                    mediaHtml = `<div class="video-container">${p.video}</div>`;
                }

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="card-body">
                        <span class="card-tag" style="background:${p.category ? 'var(--blue)' : 'transparent'}">${p.category || ''}</span>
                        <h2 class="card-title">${p.title}</h2>
                        <div class="card-stats">
                            <span><i class="far fa-clock"></i> ${p.time || 'Яқинда'}</span>
                            <span><i class="fas fa-eye"></i> ${p.views || 0} та көриш</span>
                        </div>
                        <a href="post.html?id=${id}" class="read-more">Батафсил ўқиш...</a>
                    </div>
                `;
                wrapper.appendChild(card);
            }
        });

        if (found === 0) {
            wrapper.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color:#fff;">Маълумот топилмади.</p>`;
        }
    }
</script>
<script type="module" src="bridge.js"></script>
</body>
</html>
