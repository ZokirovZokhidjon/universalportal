    <style>

        .post-video-container {

<body class="bg-black text-slate-100 font-sans min-h-screen flex flex-col selection:bg-sky-500 selection:text-black">

<!-- ЮҚОРИ ТЕСТ БАННЕРИ -->
<div class="bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 border-b border-slate-800 text-sky-400 py-2 text-center text-xs sm:text-sm font-semibold tracking-widest uppercase">
    <marquee behavior="scroll" direction="left" scrollamount="8">
        📢 UNIVERSALPORTAL SYSTEM ONLINE &nbsp;&nbsp;&bull;&nbsp;&nbsp; МАҚОЛА ВА МЕДИА ПОРТАЛ
    </marquee>
</div>

<!-- HEADER -->
<header class="bg-slate-950/90 border-b border-slate-800/90 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center gap-4">
        <a href="index.html" class="flex items-center gap-3 group">
            <img src="logo1.jpg" alt="logo" class="w-10 h-10 rounded-lg border border-slate-700 object-cover" onerror="this.style.display='none'">
            <div>
                <span class="text-xl sm:text-2xl font-black tracking-tighter metallic-text uppercase block leading-none">
                    UNIVERSALPORTAL
                </span>
                <span class="text-[10px] tracking-[0.25em] text-slate-500 uppercase block mt-0.5">
                    DIGITAL MEDIA
                </span>
            </div>
        </a>

        <a href="index.html" class="px-4 py-2 rounded-full bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-500 hover:to-blue-600 text-white text-xs font-black uppercase tracking-wider shadow-lg shadow-sky-600/25 transition flex items-center gap-2">
            <i class="fas fa-home"></i> Асосий саҳифа
        </a>
    </div>
</header>

<!-- АСОСИЙ КОНТЕНТ: ЧАПДА МАҚОЛА, ЎНГДА БОШҚА ЯНГИЛИКЛАР -->
<main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- ЧАП ТОМОН: АСОСИЙ МАҚОЛА -->
        <section class="lg:col-span-8 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 sm:p-8 shadow-2xl">
            <div id="loader" class="text-center py-16 text-sky-400">
                <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                <p class="text-xs text-slate-400 uppercase tracking-widest">Мақола юкланмоқда...</p>
            </div>

            <article id="mainPost" class="hidden">
                <img id="postImg" class="w-full max-h-[480px] object-cover rounded-xl border border-slate-800 mb-6 hidden bg-slate-950" alt="Мақола расми">

                <div class="flex flex-wrap items-center gap-2 mb-3">
                    <span id="postCat" class="inline-block text-[11px] font-extrabold uppercase bg-sky-600/20 text-sky-400 border border-sky-500/30 px-3 py-1 rounded-md"></span>
                    <span class="text-xs text-slate-400 flex items-center gap-1">
                        <i class="far fa-calendar-alt text-sky-400"></i> <span id="postTime"></span>
                    </span>
                </div>

                <h1 id="postTitle" class="text-2xl sm:text-4xl font-black text-white leading-tight mb-6 pb-4 border-b border-slate-800"></h1>

                <div id="videoContainer" class="post-video-container hidden"></div>

                <div id="postBody" class="text-base sm:text-lg text-slate-200 leading-relaxed whitespace-pre-line"></div>

                <!-- Ҳужжат ёки манба тугмалари -->
                <div id="docContainer" class="mt-8 pt-6 border-t border-slate-800 flex flex-wrap gap-3 hidden"></div>
                <div id="sourceContainer" class="mt-4 hidden"></div>
            </article>
        </section>

        <!-- ЎНГ ТОМОН: БАРЧА ЯНГИЛИКЛАРНИНГ ҚИСҚАЧА МАТНЛАРИ -->
        <aside class="lg:col-span-4 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-2xl lg:sticky lg:top-24">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                <h2 class="text-sm sm:text-base font-black uppercase tracking-wider metallic-text flex items-center gap-2">
                    <i class="fas fa-newspaper text-sky-400"></i> Барча янгиликлар
                </h2>
                <span id="sidebarCount" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-sky-500/15 text-sky-400 border border-sky-500/30">0</span>
            </div>

            <div id="sidebarPosts" class="custom-scroll space-y-3 max-h-[75vh] overflow-y-auto pr-1">
                <p class="text-center text-xs text-slate-500 py-8">Янгиликлар юкланмоқда...</p>
            </div>
        </aside>

    </div>
</main>

<!-- FOOTER -->
<footer class="bg-slate-950 border-t border-slate-800/80 py-5 text-center text-xs text-slate-500">
    UNIVERSALPORTAL &copy; 2026 — Барча ҳуқуқлар ҳимояланган
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCO079n6tlKKTXi1LjtSB1t0ddsxDMQUW4",
        databaseURL: "https://universal-portal-108b7-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "universal-portal-108b7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    // Асосий мақолани юклаш
    if (postId) {
        onValue(ref(db, 'all_posts/' + postId), (snapshot) => {
            const p = snapshot.val();
            const loader = document.getElementById('loader');
            const mainPost = document.getElementById('mainPost');

            if (p) {
                loader.classList.add('hidden');
                mainPost.classList.remove('hidden');

                document.getElementById('postTitle').innerText = p.title || '';
                document.getElementById('postBody').innerText = p.content || '';
                document.getElementById('postCat').innerText = p.category || 'Умумий';
                document.getElementById('postTime').innerText = p.time || 'Яқинда';

                // Расм
                const img = document.getElementById('postImg');
                if (p.image) {
                    img.src = p.image;
                    img.classList.remove('hidden');
                } else {
                    img.classList.add('hidden');
                }

                // Видео
                const videoDiv = document.getElementById('videoContainer');
                if (p.video) {
                    videoDiv.innerHTML = p.video;
                    videoDiv.classList.remove('hidden');
                } else {
                    videoDiv.classList.add('hidden');
                }

                // Ҳужжат (Word, Excel, PDF, PPT, PPTX) ёки ҳавола
                const docContainer = document.getElementById('docContainer');
                if (p.document && p.document.data && p.document.name) {
                    docContainer.innerHTML = `
                        <a href="${p.document.data}" download="${p.document.name}" class="inline-flex items-center gap-2 px-5 py-3 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black uppercase tracking-wider rounded-xl shadow-lg transition">
                            <i class="fas fa-download"></i> Ҳужжатни юклаб олиш (${p.document.name})
                        </a>
                    `;
                    docContainer.classList.remove('hidden');
                } else if (p.docUrl) {
                    docContainer.innerHTML = `
                        <a href="${p.docUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-5 py-3 bg-sky-600 hover:bg-sky-500 text-white text-xs font-black uppercase tracking-wider rounded-xl shadow-lg transition">
                            <i class="fas fa-external-link-alt"></i> Ҳужжатни очиш
                        </a>
                    `;
                    docContainer.classList.remove('hidden');
                } else {
                    docContainer.innerHTML = '';
                    docContainer.classList.add('hidden');
                }

                // Манба ҳаволаси
                const sourceContainer = document.getElementById('sourceContainer');
                if (p.source) {
                    sourceContainer.innerHTML = `
                        <a href="${p.source}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs text-sky-400 hover:text-sky-300 underline">
                            <i class="fas fa-link"></i> Манбага ўтиш
                        </a>
                    `;
                    sourceContainer.classList.remove('hidden');
                } else {
                    sourceContainer.innerHTML = '';
                    sourceContainer.classList.add('hidden');
                }

                document.title = (p.title || 'Блог') + ' - Universal Portal';
            } else {
                loader.innerHTML = `
                    <p class="text-slate-400 text-sm mb-4">Мақола топилмади.</p>
                    <a href="index.html" class="inline-block px-4 py-2 bg-sky-600 text-white text-xs font-bold rounded-xl">Асосий саҳифага қайтиш</a>
                `;
            }
        });
    } else {
        window.location.href = "index.html";
    }

    // Ўнг томонда барча янгиликларнинг қисқача матнларини чиқариш
    onValue(ref(db, 'all_posts'), (snapshot) => {
        const sidebar = document.getElementById('sidebarPosts');
        const countBadge = document.getElementById('sidebarCount');
        const allData = snapshot.val();

        sidebar.innerHTML = "";

        if (!allData) {
            countBadge.innerText = "0";
            sidebar.innerHTML = `<p class="text-center text-xs text-slate-500 py-8">Янгиликлар мавжуд эмас.</p>`;
            return;
        }

        const keys = Object.keys(allData).reverse();
        countBadge.innerText = keys.length;

        keys.forEach((id) => {
            const item = allData[id];
            const isCurrent = (id === postId);
            const cleanText = (item.content || '').replace(/\s+/g, ' ').trim();
            const shortText = cleanText.length > 110 ? cleanText.slice(0, 110) + '...' : (cleanText || 'Батафсил маълумотни очиб кўринг.');

            const cardLink = document.createElement('a');
            cardLink.href = `post.html?id=${id}`;
            cardLink.className = `block p-3.5 rounded-xl border transition group ${
                isCurrent
                    ? 'bg-sky-950/50 border-sky-500/70 shadow-md shadow-sky-900/20'
                    : 'bg-slate-950/80 border-slate-800/90 hover:border-sky-500/50 hover:bg-slate-950'
            }`;

            cardLink.innerHTML = `
                <div class="flex items-center justify-between gap-2 mb-1.5">
                    <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-sky-500/15 text-sky-400">
                        ${item.category || 'Янгилик'}
                    </span>
                    <span class="text-[10px] text-slate-500">${item.time || ''}</span>
                </div>
                <h3 class="text-xs sm:text-sm font-bold text-slate-100 group-hover:text-sky-400 transition line-clamp-2 mb-1">
                    ${isCurrent ? '<i class="fas fa-circle text-[7px] text-sky-400 mr-1 align-middle"></i>' : ''}${item.title || 'Сарлавҳасиз'}
                </h3>
                <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">
                    ${shortText}
                </p>
            `;

            sidebar.appendChild(cardLink);
        });
    });
</script>
