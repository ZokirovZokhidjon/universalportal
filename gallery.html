<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея - Universal Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background-color: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .indicator-dot.active {
            width: 24px;
            background-color: #7e22ce;
            box-shadow: 0 0 10px rgba(126, 34, 206, 0.75);
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

<!-- АСОСИЙ ПОРТАЛ КОНТЕЙНЕРИ -->
<div class="max-w-6xl w-full mx-auto bg-white shadow-xl my-4 border border-gray-200 flex-1 flex flex-col">

    <!-- 1. ЛОГОТИП ВА БРЕНД ҚАТОРИ -->
    <header class="px-5 py-5 border-b border-gray-200 flex flex-col md:flex-row items-center justify-between gap-4">
        <a href="index.html" class="flex items-center gap-3">
            <img src="logo1.jpg" alt="logo" class="w-12 h-12 object-cover border border-gray-300" onerror="this.style.display='none'">
            <div class="notranslate">
                <div class="text-2xl sm:text-3xl font-black tracking-tight leading-none">
                    <span class="text-gray-900">Universal</span><span class="text-purple-700 font-light">Portal</span>
                </div>
                <span class="text-[10px] uppercase tracking-[0.22em] text-gray-500 block mt-1">
                    Фото галерея
                </span>
            </div>
        </a>

        <span id="totalGalleryCount" class="text-xs font-bold px-3 py-1.5 bg-purple-700 text-white uppercase tracking-wider">
            0 та расм
        </span>
    </header>

    <!-- 2. НАВИГАЦИЯ ПАНЕЛИ -->
    <nav class="bg-[#222222] text-white flex flex-wrap items-center">
        <a href="index.html" class="px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-[#333333] border-r border-gray-800 flex items-center gap-2 transition">
            <i class="fas fa-home text-purple-400"></i> Асосий
        </a>
        <a href="post.html" class="px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-[#333333] border-r border-gray-800 transition">
            Янгиликлар
        </a>
        <a href="cinema.html" class="px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-[#333333] border-r border-gray-800 transition">
            Кинотеатр
        </a>
        <a href="klip.html" class="px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-[#333333] border-r border-gray-800 transition">
            Клиплар
        </a>
        <a href="gallery.html" class="bg-purple-700 px-4 py-3 text-xs font-bold uppercase tracking-wider border-r border-gray-800 transition">
            Галерея
        </a>
        <a href="chat.html" class="px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-[#333333] transition">
            Чат ва Мурожаат
        </a>
    </nav>

    <!-- 3. АСОСИЙ КОНТЕНТ -->
    <main class="flex-1 p-5 space-y-8">

        <!-- ИХЧАМ КАРУСЕЛЬ (СЛАЙДЕР) -->
        <section class="relative w-full h-56 sm:h-68 md:h-80 overflow-hidden border border-gray-300 bg-gray-900 group">
            <div id="compactCarouselTrack" class="flex w-full h-full transition-transform duration-500 ease-in-out">
                <div class="min-w-full h-full relative">
                    <img src="logo1.jpg" alt="Universal Portal" class="w-full h-full object-cover" onerror="this.style.display='none'">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent flex items-end p-4 sm:p-6">
                        <p class="text-xs sm:text-sm font-bold text-white line-clamp-2">
                            Universal Portal — Фото галерея ва танланган лаҳзалар
                        </p>
                    </div>
                </div>
            </div>

            <button id="compactPrevBtn" type="button" aria-label="Олдинги расм"
                    class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-black/70 hover:bg-purple-700 text-white border border-gray-600 flex items-center justify-center transition opacity-85 group-hover:opacity-100">
                <i class="fas fa-chevron-left text-xs"></i>
            </button>

            <button id="compactNextBtn" type="button" aria-label="Кейинги расм"
                    class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-black/70 hover:bg-purple-700 text-white border border-gray-600 flex items-center justify-center transition opacity-85 group-hover:opacity-100">
                <i class="fas fa-chevron-right text-xs"></i>
            </button>

            <div id="compactIndicators" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-1.5 bg-black/70 px-3 py-1.5 border border-gray-700"></div>
        </section>

        <!-- ГАЛЕРЕЯ СЕТКАСИ -->
        <section>
            <div class="flex items-center justify-between mb-5 pb-2 border-b-2 border-purple-700">
                <h1 class="text-lg sm:text-xl font-black uppercase tracking-wide text-gray-900 flex items-center gap-2">
                    <i class="fas fa-camera text-purple-700"></i> Фото галерея
                </h1>
            </div>

            <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                <div class="col-span-full text-center text-gray-500 py-14">
                    <i class="fas fa-spinner fa-spin fa-2x text-purple-700 mb-3"></i>
                    <p class="text-xs uppercase tracking-widest">Галерея юкланмоқда...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- 4. FOOTER -->
    <footer class="bg-[#222222] text-gray-300 text-xs px-5 py-4 flex flex-col sm:flex-row items-center justify-between gap-2">
        <p>© 2026 <strong>Universalportal</strong>. Барча ҳуқуқлар ҳимояланган.</p>
        <div class="flex gap-4">
            <a href="index.html" class="hover:text-white">Асосий</a>
            <a href="post.html" class="hover:text-white">Янгиликлар</a>
            <a href="cinema.html" class="hover:text-white">Кинотеатр</a>
            <a href="klip.html" class="hover:text-white">Клиплар</a>
        </div>
    </footer>

</div>

<!-- РАСМНИ КАТТАЛАШТИРИБ КЎРИШ ОЙНАСИ (LIGHTBOX) -->
<div id="lightboxModal" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
    <div class="relative max-w-4xl w-full bg-white border border-gray-300 overflow-hidden shadow-2xl">
        <button id="closeLightbox" class="absolute top-3 right-3 w-9 h-9 bg-black/75 hover:bg-purple-700 text-white flex items-center justify-center transition z-10">
            <i class="fas fa-times"></i>
        </button>
        <img id="lightboxImg" src="" alt="Катта расм" class="w-full max-h-[75vh] object-contain bg-gray-950">
        <div class="p-4 sm:p-5 border-t border-gray-200 bg-gray-50">
            <p id="lightboxText" class="text-sm text-gray-800 leading-relaxed whitespace-pre-line"></p>
            <p id="lightboxTime" class="text-[11px] text-gray-500 mt-2"></p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCO079n6tlKKTXi1LjtSB1t0ddsxDMQUW4",
        databaseURL: "https://universal-portal-108b7-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "universal-portal-108b7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const grid = document.getElementById('galleryGrid');
    const countBadge = document.getElementById('totalGalleryCount');
    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxText = document.getElementById('lightboxText');
    const lightboxTime = document.getElementById('lightboxTime');

    const carouselTrack = document.getElementById('compactCarouselTrack');
    const indicatorsBox = document.getElementById('compactIndicators');
    const prevBtn = document.getElementById('compactPrevBtn');
    const nextBtn = document.getElementById('compactNextBtn');

    let slideIndex = 0;
    let totalSlides = 1;

    function openLightbox(item) {
        lightboxImg.src = item.image || '';
        lightboxText.innerText = item.text || '';
        lightboxTime.innerText = item.time || '';
        lightboxModal.classList.remove('hidden');
    }

    function updateCarouselPosition() {
        carouselTrack.style.transform = `translateX(-${slideIndex * 100}%)`;
        const dots = indicatorsBox.querySelectorAll('.indicator-dot');
        dots.forEach((dot, idx) => dot.classList.toggle('active', idx === slideIndex));
    }

    function goNextSlide() {
        if (totalSlides <= 1) return;
        slideIndex = (slideIndex + 1) % totalSlides;
        updateCarouselPosition();
    }

    function goPrevSlide() {
        if (totalSlides <= 1) return;
        slideIndex = (slideIndex - 1 + totalSlides) % totalSlides;
        updateCarouselPosition();
    }

    prevBtn.onclick = goPrevSlide;
    nextBtn.onclick = goNextSlide;
    setInterval(goNextSlide, 4500);

    function renderCompactCarousel(items) {
        const featured = items.slice(0, 6);
        if (!featured.length) return;

        totalSlides = featured.length;
        slideIndex = 0;
        carouselTrack.innerHTML = "";
        indicatorsBox.innerHTML = "";

        featured.forEach((item, idx) => {
            const slide = document.createElement('div');
            slide.className = 'min-w-full h-full relative cursor-pointer';
            slide.innerHTML = `
                <img src="${item.image}" alt="Слайд расми" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent flex items-end justify-between gap-4 p-4 sm:p-6">
                    <p class="text-xs sm:text-sm font-bold text-white line-clamp-2">
                        ${item.text || 'Галерея расми'}
                    </p>
                    <span class="text-[11px] text-purple-300 font-semibold shrink-0 hidden sm:inline">
                        Катталаштириш <i class="fas fa-expand-alt ml-1"></i>
                    </span>
                </div>
            `;
            slide.onclick = () => openLightbox(item);
            carouselTrack.appendChild(slide);

            const dot = document.createElement('span');
            dot.className = `indicator-dot ${idx === 0 ? 'active' : ''}`;
            dot.onclick = (e) => {
                e.stopPropagation();
                slideIndex = idx;
                updateCarouselPosition();
            };
            indicatorsBox.appendChild(dot);
        });

        updateCarouselPosition();
    }

    document.getElementById('closeLightbox').onclick = () => lightboxModal.classList.add('hidden');
    lightboxModal.onclick = (e) => {
        if (e.target === lightboxModal) lightboxModal.classList.add('hidden');
    };

    onValue(ref(db, 'gallery_items'), (snapshot) => {
        const data = snapshot.val();
        grid.innerHTML = "";

        if (!data) {
            countBadge.innerText = "0 та расм";
            grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-14">Галереяда ҳозирча расмлар мавжуд эмас.</p>`;
            return;
        }

        const items = Object.keys(data)
            .reverse()
            .map((id) => data[id])
            .filter((item) => item && item.image);

        countBadge.innerText = `${items.length} та расм`;
        renderCompactCarousel(items);

        if (!items.length) {
            grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-14">Галереяда ҳозирча расмлар мавжуд эмас.</p>`;
            return;
        }

        items.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'border border-gray-200 bg-white overflow-hidden hover:border-purple-700 transition group flex flex-col justify-between cursor-pointer';
            card.innerHTML = `
                <div class="overflow-hidden bg-gray-100 border-b border-gray-200">
                    <img src="${item.image}" alt="Галерея расми"
                         class="w-full h-60 object-cover group-hover:scale-105 transition duration-500">
                </div>
                <div class="p-4 flex-1 flex flex-col justify-between">
                    <p class="text-xs sm:text-sm text-gray-800 leading-relaxed whitespace-pre-line">
                        ${item.text || ''}
                    </p>
                    <div class="flex items-center justify-between text-[11px] text-gray-500 mt-3 pt-2.5 border-t border-gray-100">
                        <span><i class="far fa-clock text-purple-700 mr-1"></i> ${item.time || ''}</span>
                        <span class="text-purple-700 font-bold group-hover:underline">Катталаштириш</span>
                    </div>
                </div>
            `;

            card.onclick = () => openLightbox(item);
            grid.appendChild(card);
        });
    });
</script>
</body>
</html>
