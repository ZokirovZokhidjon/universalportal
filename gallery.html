    <style>
        /* Сарлавҳадаги Металл / Силвер Текстура Эффекти */
        .metallic-text {
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 50%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }

        /* Неон Ёруғлик Эффекти Card'лар учун */
        .glow-card {
            box-shadow: 0 0 20px -5px rgba(56, 189, 248, 0.15);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-card:hover {
            box-shadow: 0 0 30px 5px rgba(56, 189, 248, 0.35);
            transform: translateY(-5px);
        }

        /* Карусель Индикаторлари (Нуқтачалар) */
        .indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 9999px;
            background-color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .indicator-dot.active {
            width: 32px;
            background-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
        }

        /* Махсус Скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }
    </style>

    <!-- СЛАЙДЕР ЖАВАCКРИПТ МАНТИҒИ -->
    <script>
        const carousel = document.querySelector('.carousel');
        const carouselItems = document.querySelectorAll('.carousel-item');
        const carouselPrev = document.querySelector('.carousel-prev');
        const carouselNext = document.querySelector('.carousel-next');
        const carouselIndicators = document.querySelectorAll('.indicator-dot');

        let currentSlide = 0;

        function showSlide(n) {
            carousel.style.transform = `translateX(-${n * 100}%)`;
            carouselIndicators.forEach((indicator, index) => {
                indicator.classList.toggle('active', index === n);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % carouselItems.length;
            showSlide(currentSlide);
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + carouselItems.length) % carouselItems.length;
            showSlide(currentSlide);
        }

        if (carouselPrev && carouselNext) {
            carouselPrev.addEventListener('click', prevSlide);
            carouselNext.addEventListener('click', nextSlide);
        }

        carouselIndicators.forEach((indicator, index) => {
            indicator.addEventListener('click', () => {
                currentSlide = index;
                showSlide(currentSlide);
            });
        });

        // Автомат равишда алмашиш (5 сония)
        setInterval(nextSlide, 5000);
    </script>
