<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея - Universal Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .metallic-text {
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 50%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-black text-slate-100 font-sans min-h-screen flex flex-col selection:bg-emerald-500 selection:text-black">

<header class="bg-slate-950/90 border-b border-slate-800/90 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
        <a href="index.html" class="flex items-center gap-3">
            <img src="logo1.jpg" alt="logo" class="w-10 h-10 rounded-lg border border-slate-700 object-cover" onerror="this.style.display='none'">
            <div>
                <span class="text-xl sm:text-2xl font-black tracking-tighter metallic-text uppercase block leading-none">
                    UNIVERSALPORTAL
                </span>
                <span class="text-[10px] tracking-[0.25em] text-emerald-400 uppercase block mt-0.5">
                    ФОТО ГАЛЕРЕЯ
                </span>
            </div>
        </a>

        <nav class="flex flex-wrap items-center gap-2 text-xs font-bold">
            <a href="post.html" class="px-3.5 py-2 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 transition">Янгиликлар</a>
            <a href="cinema.html" class="px-3.5 py-2 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 transition">Кинотеатр</a>
            <a href="klip.html" class="px-3.5 py-2 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 transition">Клиплар</a>
            <a href="gallery.html" class="px-3.5 py-2 rounded-full bg-emerald-600 text-white">Галерея</a>
            <a href="index.html" class="px-3.5 py-2 rounded-full bg-slate-900 border border-slate-700 hover:border-sky-500 text-sky-400 transition">
                <i class="fas fa-home"></i> Асосий
            </a>
        </nav>
    </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
        <h1 class="text-xl sm:text-3xl font-black uppercase tracking-tight metallic-text flex items-center gap-2.5">
            <i class="fas fa-camera text-emerald-400"></i> Фото галерея
        </h1>
        <span id="totalGalleryCount" class="text-xs font-bold px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
            0 та расм
        </span>
    </div>

    <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center text-slate-500 py-16">
            <i class="fas fa-spinner fa-spin fa-2x text-emerald-400 mb-3"></i>
            <p class="text-xs uppercase tracking-widest">Галерея юкланмоқда...</p>
        </div>
    </div>
</main>

<!-- РАСМНИ КАТТАЛАШТИРИБ КЎРИШ ОЙНАСИ (LIGHTBOX) -->
<div id="lightboxModal" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
    <div class="relative max-w-4xl w-full bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
        <button id="closeLightbox" class="absolute top-3 right-3 w-10 h-10 rounded-full bg-black/70 hover:bg-rose-600 text-white flex items-center justify-center transition z-10">
            <i class="fas fa-times"></i>
        </button>
        <img id="lightboxImg" src="" alt="Катта расм" class="w-full max-h-[75vh] object-contain bg-black">
        <div class="p-4 sm:p-5 border-t border-slate-800">
            <p id="lightboxText" class="text-sm sm:text-base text-slate-200 leading-relaxed whitespace-pre-line"></p>
            <p id="lightboxTime" class="text-[11px] text-slate-500 mt-2"></p>
        </div>
    </div>
</div>

<footer class="bg-slate-950 border-t border-slate-800/80 py-5 text-center text-xs text-slate-500">
    UNIVERSALPORTAL &copy; 2026 — Барча ҳуқуқлар ҳимояланган
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCO079n6tlKKTXi1LjtSB1t0ddsxDMQUW4",
        databaseURL: "https://universal-portal-108b7-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "universal-portal-108b7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const grid = document.getElementById('galleryGrid');
    const countBadge = document.getElementById('totalGalleryCount');
    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxText = document.getElementById('lightboxText');
    const lightboxTime = document.getElementById('lightboxTime');

    document.getElementById('closeLightbox').onclick = () => lightboxModal.classList.add('hidden');
    lightboxModal.onclick = (e) => {
        if (e.target === lightboxModal) lightboxModal.classList.add('hidden');
    };

    onValue(ref(db, 'gallery_items'), (snapshot) => {
        const data = snapshot.val();
        grid.innerHTML = "";

        if (!data) {
            countBadge.innerText = "0 та расм";
            grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-16">Галереяда ҳозирча расмлар мавжуд эмас.</p>`;
            return;
        }

        const keys = Object.keys(data).reverse();
        countBadge.innerText = `${keys.length} та расм`;

        keys.forEach((id) => {
            const item = data[id];
            if (!item || !item.image) return;

            const card = document.createElement('div');
            card.className = 'bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-emerald-500/50 transition group flex flex-col justify-between cursor-pointer';
            card.innerHTML = `
                <div class="overflow-hidden bg-slate-950">
                    <img src="${item.image}" alt="Галерея расми"
                         class="w-full h-64 object-cover group-hover:scale-105 transition duration-500">
                </div>
                <div class="p-4 flex-1 flex flex-col justify-between">
                    <p class="text-xs sm:text-sm text-slate-200 leading-relaxed whitespace-pre-line">
                        ${item.text || ''}
                    </p>
                    <div class="flex items-center justify-between text-[11px] text-slate-500 mt-3 pt-2.5 border-t border-slate-800/80">
                        <span><i class="far fa-clock text-emerald-400 mr-1"></i> ${item.time || ''}</span>
                        <span class="text-emerald-400 font-semibold group-hover:underline">Катталаштириш</span>
                    </div>
                </div>
            `;

            card.onclick = () => {
                lightboxImg.src = item.image;
                lightboxText.innerText = item.text || '';
                lightboxTime.innerText = item.time || '';
                lightboxModal.classList.remove('hidden');
            };

            grid.appendChild(card);
        });
    });
</script>
</body>
</html>
