<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотеатр - Universal Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .movie-player iframe,
        .movie-player video {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            display: block;
            background: #111827;
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f3f4f6; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #7e22ce; }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

<!-- АСОСИЙ ПОРТАЛ КОНТЕЙНЕРИ -->
<div class="max-w-6xl w-full mx-auto bg-white shadow-xl my-4 border border-gray-200 flex-1 flex flex-col">

    <!-- 1. ЛОГОТИП ВА БРЕНД ҚАТОРИ -->
    <header class="px-5 py-5 border-b border-gray-200 flex flex-col md:flex-row items-center justify-between gap-4">
        <a href="index.html" class="flex items-center gap-3">
            <img src="logo1.jpg" alt="logo" class="w-12 h-12 object-cover border border-gray-300" onerror="this.style.display='none'">
            <div class="notranslate">
                <div class="text-2xl sm:text-3xl font-black tracking-tight leading-none">
                    <span class="text-gray-900">Universal</span><span class="text-purple-700 font-light">Portal</span>
                </div>
                <span class="text-[10px] uppercase tracking-[0.22em] text-gray-500 block mt-1">
                    Кинотеатр
                </span>
            </div>
        </a>

        <div class="w-full md:w-80 flex items-center bg-gray-100 border border-gray-300 p-1">
            <input type="text" id="movieSearch" oninput="renderMoviesList()" placeholder="Фильмлардан излаш..." class="w-full bg-transparent px-3 py-1 text-xs text-gray-800 outline-none">
            <span class="text-gray-400 px-2 text-xs"><i class="fas fa-search"></i></span>
        </div>
    </header>

    <!-- 2. НАВИГАЦИЯ ПАНЕЛИ -->
    <nav class="bg-[#222222] text-white flex flex-wrap items-center">
        <a href="index.html" class="px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-[#333333] border-r border-gray-800 flex items-center gap-2 transition">
            <i class="fas fa-home text-purple-400"></i> Асосий
        </a>
        <a href="post.html" class="px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-[#333333] border-r border-gray-800 transition">
            Янгиликлар
        </a>
        <a href="cinema.html" class="bg-purple-700 px-4 py-3 text-xs font-bold uppercase tracking-wider border-r border-gray-800 transition">
            Кинотеатр
        </a>
        <a href="klip.html" class="px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-[#333333] border-r border-gray-800 transition">
            Клиплар
        </a>
        <a href="gallery.html" class="px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-[#333333] border-r border-gray-800 transition">
            Галерея
        </a>
        <a href="chat.html" class="px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-[#333333] transition">
            Чат ва Мурожаат
        </a>
    </nav>

    <!-- 3. АСОСИЙ КОНТЕНТ -->
    <main class="flex-1 p-5 grid grid-cols-1 lg:grid-cols-12 gap-7 items-start">

        <!-- ЧАП ТОМОН: ФИЛЬМ ПЛЕЕРИ ВА ТАВСИФИ -->
        <section class="lg:col-span-8 bg-white border border-gray-200 p-5 sm:p-7">
            <div id="movieLoader" class="text-center py-16 text-purple-700">
                <i class="fas fa-film fa-spin fa-2x mb-3"></i>
                <p class="text-xs text-gray-500 uppercase tracking-widest">Фильм юкланмоқда...</p>
            </div>

            <article id="mainMovie" class="hidden">
                <div id="moviePlayer" class="movie-player mb-5 border border-gray-300 overflow-hidden bg-gray-950"></div>

                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <div class="flex flex-wrap items-center gap-2">
                        <span id="movieCat" class="inline-block text-[10px] font-extrabold uppercase bg-purple-700 text-white px-2.5 py-1"></span>
                        <span class="text-xs text-gray-500 flex items-center gap-1">
                            <i class="far fa-clock text-purple-700"></i> <span id="movieTime"></span>
                        </span>
                    </div>
                </div>

                <h1 id="movieTitle" class="text-2xl sm:text-3xl font-black text-gray-900 leading-tight mb-4 pb-3 border-b-2 border-purple-700"></h1>

                <div id="movieDesc" class="text-base text-gray-800 leading-relaxed whitespace-pre-line"></div>
            </article>
        </section>

        <!-- ЎНГ ТОМОН: БАРЧА ФИЛЬМЛАР РЎЙХАТИ ВА РАСМЛАРИ -->
        <aside class="lg:col-span-4 bg-gray-50 border border-gray-200 p-4 lg:sticky lg:top-4">
            <div class="flex items-center justify-between mb-4 pb-2 border-b-2 border-purple-700">
                <h2 class="text-sm font-black uppercase tracking-wider text-gray-900 flex items-center gap-2">
                    <i class="fas fa-video text-purple-700"></i> Барча фильмлар
                </h2>
                <span id="movieCount" class="text-[11px] font-bold px-2 py-0.5 bg-purple-700 text-white">0</span>
            </div>

            <div id="sidebarMovies" class="custom-scroll space-y-2.5 max-h-[72vh] overflow-y-auto pr-1">
                <p class="text-center text-xs text-gray-500 py-8">Фильмлар юкланмоқда...</p>
            </div>
        </aside>

    </main>

    <!-- 4. FOOTER -->
    <footer class="bg-[#222222] text-gray-300 text-xs px-5 py-4 flex flex-col sm:flex-row items-center justify-between gap-2">
        <p>© 2026 <strong>Universalportal</strong>. Барча ҳуқуқлар ҳимояланган.</p>
        <div class="flex gap-4">
            <a href="index.html" class="hover:text-white">Асосий</a>
            <a href="post.html" class="hover:text-white">Янгиликлар</a>
            <a href="klip.html" class="hover:text-white">Клиплар</a>
            <a href="chat.html" class="hover:text-white">Мурожаат</a>
        </div>
    </footer>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCO079n6tlKKTXi1LjtSB1t0ddsxDMQUW4",
        databaseURL: "https://universal-portal-108b7-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "universal-portal-108b7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let selectedMovieId = urlParams.get('id');
    let cachedAllData = null;
    let cachedMovieKeys = [];

    function isMovieItem(item) {
        if (!item) return false;
        const raw = `${item.type || ''} ${item.category || ''} ${item.section || ''}`.toLowerCase();
        return raw.includes('кино') || raw.includes('фильм') || raw.includes('cinema') || raw.includes('movie');
    }

    function buildPlayerHtml(item) {
        if (item.video) {
            if (item.video.trim().startsWith('<')) return item.video;
            return `<video src="${item.video}" controls preload="metadata"></video>`;
        }
        if (item.videoUrl) {
            return `<video src="${item.videoUrl}" controls preload="metadata"></video>`;
        }
        if (item.image) {
            return `<img src="${item.image}" alt="${item.title || 'Фильм'}" class="w-full max-h-[460px] object-cover">`;
        }
        return `<div class="p-12 text-center text-gray-400 text-sm">Видео манбаси киритилмаган.</div>`;
    }

    function renderMovie(m) {
        const loader = document.getElementById('movieLoader');
        const mainMovie = document.getElementById('mainMovie');

        if (!m) {
            loader.classList.remove('hidden');
            mainMovie.classList.add('hidden');
            loader.innerHTML = `<p class="text-gray-500 text-sm">Ҳозирча фильмлар йўқ.</p>`;
            return;
        }

        loader.classList.add('hidden');
        mainMovie.classList.remove('hidden');

        document.getElementById('moviePlayer').innerHTML = buildPlayerHtml(m);
        document.getElementById('movieTitle').innerText = m.title || 'Номсиз фильм';
        document.getElementById('movieCat').innerText = m.category || 'Фильм';
        document.getElementById('movieTime').innerText = m.time || 'Яқинда';
        document.getElementById('movieDesc').innerText = m.content || m.description || '';
        document.title = (m.title || 'Кинотеатр') + ' - Universal Portal';
    }

    window.renderMoviesList = function() {
        const sidebar = document.getElementById('sidebarMovies');
        const query = (document.getElementById('movieSearch')?.value || '').toLowerCase().trim();
        sidebar.innerHTML = "";

        if (!cachedAllData || !cachedMovieKeys.length) {
            sidebar.innerHTML = `<p class="text-center text-xs text-gray-500 py-8">Фильмлар топилмади.</p>`;
            return;
        }

        const filtered = cachedMovieKeys.filter((id) => {
            const item = cachedAllData[id];
            if (!query) return true;
            return (item.title || '').toLowerCase().includes(query) ||
                   (item.category || '').toLowerCase().includes(query);
        });

        if (!filtered.length) {
            sidebar.innerHTML = `<p class="text-center text-xs text-gray-500 py-6">Мос фильм топилмади.</p>`;
            return;
        }

        filtered.forEach((id) => {
            const item = cachedAllData[id];
            const isCurrent = (id === selectedMovieId);
            const poster = item.image || 'logo1.jpg';

            const card = document.createElement('a');
            card.href = `cinema.html?id=${id}`;
            card.className = `flex items-center gap-3 p-2.5 border transition group ${
                isCurrent
                    ? 'bg-white border-purple-700 shadow-sm'
                    : 'bg-white border-gray-200 hover:border-purple-700'
            }`;

            card.innerHTML = `
                <img src="${poster}" alt="${item.title || 'Фильм'}"
                     class="w-16 h-20 object-cover border border-gray-200 shrink-0 bg-gray-100"
                     onerror="this.src='logo1.jpg'">
                <div class="min-w-0 flex-1">
                    <span class="inline-block text-[10px] font-bold uppercase px-2 py-0.5 mb-1 ${
                        isCurrent ? 'bg-purple-700 text-white' : 'bg-gray-200 text-gray-700'
                    }">
                        ${item.category || 'Фильм'}
                    </span>
                    <h3 class="text-xs font-bold text-gray-900 group-hover:text-purple-700 transition line-clamp-2">
                        ${item.title || 'Сарлавҳасиз фильм'}
                    </h3>
                    <p class="text-[10px] text-gray-400 mt-1">${item.time || ''}</p>
                </div>
            `;

            sidebar.appendChild(card);
        });
    };

    onValue(ref(db, 'all_posts'), (snapshot) => {
        const countBadge = document.getElementById('movieCount');
        const allData = snapshot.val();
        cachedAllData = allData;

        if (!allData) {
            countBadge.innerText = "0";
            cachedMovieKeys = [];
            renderMoviesList();
            renderMovie(null);
            return;
        }

        cachedMovieKeys = Object.keys(allData)
            .filter((id) => isMovieItem(allData[id]))
            .reverse();

        countBadge.innerText = cachedMovieKeys.length;

        if (!cachedMovieKeys.length) {
            renderMoviesList();
            renderMovie(null);
            return;
        }

        if (!selectedMovieId || !allData[selectedMovieId] || !isMovieItem(allData[selectedMovieId])) {
            selectedMovieId = cachedMovieKeys[0];
        }

        renderMovie(allData[selectedMovieId]);
        renderMoviesList();
    });
</script>
</body>
</html>
